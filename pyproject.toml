[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "datatrust"
version = "0.1.0"
description = "A fault-tolerant data reliability platform with automated detection, quarantine, recovery, and verification."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }

dependencies = [
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.5,<3",
    "psycopg[binary]>=3.2,<4",
    "confluent-kafka>=2.6,<3",
    "pyarrow>=17.0,<19",
    "pandas>=2.2,<3",
    "structlog>=24.4,<25",
    "typer>=0.12,<0.16",
    "rich>=13.8,<14",
    "prometheus-client>=0.21,<1",
    "tenacity>=9.0,<10",
]

[project.optional-dependencies]
dashboard = ["streamlit>=1.39,<2", "plotly>=5.24,<6"]
spark = ["pyspark>=3.5,<4"]
dev = [
    "pytest>=8.3,<9",
    "pytest-cov>=5.0,<7",
    "pytest-timeout>=2.3,<3",
    "hypothesis>=6.112,<7",
    "ruff>=0.7,<0.15",
    "mypy>=1.11,<2",
    "pre-commit>=4.0,<5",
    "testcontainers[postgres,kafka]>=4.8,<5",
]

[project.scripts]
datatrust = "datatrust.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/datatrust"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RET", "ARG", "PTH", "TID", "RUF"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ARG001", "ARG002"]

[tool.mypy]
python_version = "3.12"
packages = ["datatrust"]
mypy_path = "src"
strict_optional = true
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = ["confluent_kafka.*", "pyspark.*", "streamlit.*", "plotly.*", "testcontainers.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
timeout = 300
markers = [
    "unit: fast, no external services",
    "integration: requires Postgres and/or Kafka",
    "e2e: full pipeline through real services",
    "scenario: failure-lab scenario verification",
    "performance: benchmarks, slow",
    "spark: requires a JVM and PySpark",
]
